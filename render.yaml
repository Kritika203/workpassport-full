# Free instance spins down after 15 idle minutes; not recommended for a time-critical live demo.
# Use the blueprint only after adding a PostgreSQL DATABASE_URL in Render.
services:
  - type: web
    name: workpassport-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: 'false'
      - key: DJANGO_HTTPS_ONLY
        value: 'true'
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: WEB_FRONTEND_URL
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_BACKEND
        value: accounts.email_backend.BrevoAPIEmailBackend
      - key: ALLOW_DEMO_SESSIONS
        value: 'false'
