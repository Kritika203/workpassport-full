name: Vouch checks
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python backend/manage.py makemigrations --check --dry-run
        env:
          DJANGO_DEBUG: 'true'
      - run: python backend/manage.py migrate
        env:
          DJANGO_DEBUG: 'true'
      - run: python backend/manage.py test accounts opportunities workflows
        env:
          DJANGO_DEBUG: 'true'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:ui
      - run: npm run build
